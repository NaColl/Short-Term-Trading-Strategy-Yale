[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "antigravity"
version = "0.1.0"
description = "APEX — Adaptive Position & Event eXecution System"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.12"
authors = [
    {name = "APEX Capital", email = "engineering@apexcapital.com"},
]

dependencies = [
    # ── Core ──────────────────────────────────────────────────
    "pydantic>=2.6,<3.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",

    # ── Database & Messaging ─────────────────────────────────
    "supabase>=2.3.0",
    "redis>=5.0.0",

    # ── HTTP & Networking ────────────────────────────────────
    "httpx>=0.27.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",

    # ── LLM & AI ─────────────────────────────────────────────
    "langchain-anthropic>=0.1.1",
    "langchain-core>=0.1.27",

    # ── Data Processing ──────────────────────────────────────
    "polars>=0.20.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",

    # ── ML & Optimization ────────────────────────────────────
    "torch>=2.2.0",
    "xgboost>=2.0.0",
    "cvxpy>=1.4.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",

    # ── Broker Integration ───────────────────────────────────
    "ib_insync>=0.9.86",

    # ── Task Queue ───────────────────────────────────────────
    "celery[redis]>=5.3.0",

    # ── Web Scraping ─────────────────────────────────────────
    "firecrawl-py>=0.0.16",

    # ── Dashboard ────────────────────────────────────────────
    "streamlit>=1.31.0",
    "plotly>=5.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
include = ["shared*", "services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring external services (deselect with '-m \"not integration\"')",
    "slow: marks tests that are slow to run",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "ANN", "S", "B"]
ignore = ["ANN101", "ANN102", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
